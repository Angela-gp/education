name: Solana CI

on:
  push:
    branches:
      - task/01-tests
      - task/02-burn
      - task/03-escrow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.89.0
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component clippy,rustfmt
          rustup default 1.89.0

      - name: Install Solana CLI 3.1.10
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI 1.1.2
        run: cargo +stable install anchor-cli --version 1.1.2 --locked

      - name: Verify toolchain versions
        run: |
          rustc --version
          solana --version
          anchor --version

      - name: Build program
        run: anchor build --ignore-keys

      - name: Run LiteSVM tests
        run: cargo test --workspace --locked
